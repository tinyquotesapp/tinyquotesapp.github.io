<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Tiny Quotes</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #2c2c2c;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 60%, #fff 100%);
      border-radius: 16px;
      padding: 64px 32px;
      text-align: center;
      max-width: 520px;
    }
    h1 { font-size: 1.8rem; font-weight: 800; color: #1a1a1a; margin-bottom: 12px; letter-spacing: -0.5px; }
    h1 span { color: #d97706; }
    p { color: #555; margin-bottom: 28px; }
    a.home {
      display: inline-block;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .links { margin-top: 22px; font-size: 0.8rem; }
    .links a { color: #d97706; text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>That page took a <span>quiet</span> exit</h1>
    <p>We couldn't find what you were looking for.</p>
    <a class="home" href="/">Back to Tiny Quotes</a>
    <p class="links" style="margin-bottom:0;">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
    </p>
  </div>
</body>
</html>
